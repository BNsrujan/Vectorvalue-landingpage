<!-- @dsCard group="Brand" viewport="700x200" name="Imagery treatment" subtitle="Architecture and infrastructure, desaturated and behind ink — never site-worker stock at full colour" -->
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            margin: 0;
            padding: 20px 24px;
            background: var(--surface-page);
            font-family: var(--font-core)
        }

        .r {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px
        }

        .f {
            aspect-ratio: 4/3;
            overflow: hidden;
            background: var(--neutral-300);
            position: relative
        }

        .f img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1) contrast(1.05)
        }

        .o {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(15, 18, 25, .10), rgba(15, 18, 25, .55))
        }

        .l {
            display: block;
            margin-top: 8px;
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--text-muted)
        }
    </style>
</head>

<body>
    <div class="r">
        <div>
            <div class="f"><img src="../../../public/assets/imagery/towers-upward-monochrome.jpg" alt=""><span class="o"></span>
            </div><span class="l">hero · architecture</span>
        </div>
        <div>
            <div class="f"><img src="../../../public/assets/imagery/coastal-viaduct-aerial.jpg" alt=""><span class="o"></span></div>
            <span class="l">infrastructure</span>
        </div>
        <div>
            <div class="f"><img src="../../../public/assets/imagery/engineers-drawings-topdown.jpg" alt=""><span class="o"></span>
            </div><span class="l">documents · desk</span>
        </div>
        <div>
            <div class="f"><img src="../../../public/assets/imagery/bridge-aerial-forest.jpg" alt=""><span class="o"></span></div>
            <span class="l">aerial · context</span>
        </div>
    </div>
</body>

</html>
