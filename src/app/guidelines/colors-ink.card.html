<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-core)}.r{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}.s{height:56px}.h{display:block;margin-top:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:.05em;color:var(--text-muted)}</style></head><body><div class="r"><div><div class="s" style="background:var(--ink-950)"></div><span class="h">ink-950</span></div><div><div class="s" style="background:var(--ink-900)"></div><span class="h">ink-900</span></div><div><div class="s" style="background:var(--ink-800)"></div><span class="h">ink-800</span></div><div><div class="s" style="background:var(--ink-700)"></div><span class="h">ink-700</span></div><div><div class="s" style="background:var(--ink-600)"></div><span class="h">ink-600</span></div><div><div class="s" style="background:var(--slate-600)"></div><span class="h">slate-600</span></div><div><div class="s" style="background:var(--slate-400)"></div><span class="h">slate-400</span></div><div><div class="s" style="background:var(--slate-300)"></div><span class="h">slate-300</span></div><div><div class="s" style="background:var(--slate-100)"></div><span class="h">slate-100</span></div></div></body></html>
