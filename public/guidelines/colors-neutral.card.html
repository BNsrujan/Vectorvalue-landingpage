<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-core)}.r{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.s{height:56px;border:1px solid var(--border-hairline)}.h{display:block;margin-top:6px;font-family:var(--font-mono);font-size:9px;letter-spacing:.05em;color:var(--text-muted)}</style></head><body><div class="r"><div><div class="s" style="background:var(--neutral-000)"></div><span class="h">000 · page</span></div><div><div class="s" style="background:var(--neutral-050)"></div><span class="h">050 · hover</span></div><div><div class="s" style="background:var(--neutral-100)"></div><span class="h">100 · subtle</span></div><div><div class="s" style="background:var(--neutral-200)"></div><span class="h">200 · sunken</span></div><div><div class="s" style="background:var(--neutral-250)"></div><span class="h">250 · hairline</span></div><div><div class="s" style="background:var(--neutral-300)"></div><span class="h">300 · border</span></div><div><div class="s" style="background:var(--neutral-400)"></div><span class="h">400</span></div></div></body></html>
