<!-- @dsCard group="Colors" viewport="700x180" name="60 / 30 / 10 balance" subtitle="How much of each family a page is allowed to use" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);font-family:var(--font-core)}.bar{display:grid;grid-template-columns:6fr 3fr 1fr;height:64px;border:1px solid var(--border-hairline)}.l{display:flex;align-items:flex-end;padding:10px;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.c{display:grid;grid-template-columns:6fr 3fr 1fr;gap:0;margin-top:10px;font-family:var(--font-core);font-size:11px;color:var(--text-secondary)}.c span{padding-right:12px}</style></head><body><div class="bar"><div class="l" style="background:var(--neutral-000);color:var(--text-muted);box-shadow:inset 0 0 0 1px var(--border-hairline)">60 · light</div><div class="l" style="background:var(--ink-800);color:rgba(255,255,255,.8)">30 · dark</div><div class="l" style="background:var(--orange-600);color:#fff">10</div></div><div class="c"><span>White and #F5F5F5 backgrounds carry the page. Text is ink on light.</span><span>Ink and slate for full-bleed bands, footer, mega-menu rail, map sections.</span><span>CTA, active nav, key numbers.</span></div></body></html>
