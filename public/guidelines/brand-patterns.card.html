<!-- @dsCard group="Brand" viewport="700x180" name="Technical motifs" subtitle="Blueprint grid, hatch and dot patterns — always faint, never foreground" -->
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            margin: 0;
            padding: 20px 24px;
            background: var(--surface-page);
            font-family: var(--font-core)
        }

        .r {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px
        }

        .b {
            height: 96px;
            border: 1px solid var(--border-hairline)
        }

        .l {
            display: block;
            margin-top: 8px;
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--text-muted)
        }
    </style>
</head>

<body>
    <div class="r">
        <div>
            <div class="b" style="background-image:var(--pattern-blueprint);background-size:22px 22px"></div><span
                class="l">blueprint · light</span>
        </div>
        <div>
            <div class="b"
                style="background:var(--ink-900);background-image:var(--pattern-blueprint-dark);background-size:22px 22px">
            </div><span class="l">blueprint · dark</span>
        </div>
        <div>
            <div class="b" style="background-image:var(--pattern-hatch)"></div><span class="l">hatch</span>
        </div>
        <div>
            <div class="b" style="background-image:var(--pattern-dot);background-size:10px 10px"></div><span
                class="l">dot matrix</span>
        </div>
    </div>
</body>

</html>
